{{- if .Values.job -}}
{{- range $job := .Values.job }}
{{- if (and $job.application $job.application.env) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $job.name }}
  labels:
    app.kubernetes.io/part-of: job
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
data:
  {{ toYaml $job.application.env | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
